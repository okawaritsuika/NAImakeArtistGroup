<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arca 로그인 연결</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Arca 로그인 연결</h1>
      <p>아카라이브에 로그인한 이 Chrome의 세션을 로컬 앱에 연결합니다.</p>
      <button id="connectSession" type="button">현재 로그인 연결</button>
      <p id="status" class="status" role="status" aria-live="polite">로컬 앱을 먼저 실행해 주세요.</p>
      <p class="privacy">쿠키 값은 표시하거나 저장하지 않습니다.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
