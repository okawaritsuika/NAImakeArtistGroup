<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danbooru Artist Rater</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Danbooru Artist Rater</h1>
        <p>2025-01-31 이전 Danbooru 게시물만 사용합니다.</p>
      </div>
      <nav class="tabs">
        <button class="tab active" data-tab="pick">작가 뽑기</button>
        <button class="tab" data-tab="ratings">평가 관리</button>
      </nav>
    </header>

    <main>
      <section id="pick-tab" class="view active">
        <div class="pick-layout">
          <aside id="conditionPanel" class="panel conditions">
            <div class="panel-title">
              <h2>조건</h2>
              <button id="closeConditions" class="ghost">닫기</button>
            </div>
            <label class="field">
              <span>태그/프롬프트</span>
              <textarea id="queryText" placeholder="비워두면 전체 작가 중 랜덤으로 뽑습니다. 예: school_uniform, lying, looking_at_viewer"></textarea>
              <div id="autocomplete" class="autocomplete hidden"></div>
            </label>
            <div class="notice">
              <p>이미 평가한 작가는 자동으로 제외됩니다.</p>
              <p>이미지는 다음 작가를 볼 때만 가져옵니다.</p>
            </div>
            <label class="field">
              <span>최소 전체 게시물 수</span>
              <input id="minArtistPostCount" type="number" min="0" value="1000">
              <small class="help-text">
                1000은 꽤 강한 필터입니다. 특정 소품/구도 태그에서는 100~300으로 낮추면 후보가 훨씬 늘어납니다.
              </small>
            </label>
            <label class="field">
              <span>태그 조건 내 최소 출현 수</span>
              <input id="minMatchCount" type="number" min="1" value="3">
            </label>
            <label class="field">
              <span>수집 페이지 수</span>
              <select id="fetchPages">
                <option>1</option>
                <option>3</option>
                <option selected>5</option>
                <option>8</option>
                <option>10</option>
              </select>
            </label>
            <label class="field">
              <span>후보 작가 수</span>
              <select id="candidateLimit">
                <option>8</option>
                <option selected>12</option>
                <option>16</option>
                <option>24</option>
              </select>
            </label>
            <label class="field">
              <span>샘플 이미지 수</span>
              <select id="sampleLimit">
                <option>6</option>
                <option selected>10</option>
                <option>12</option>
                <option>16</option>
              </select>
            </label>
            <label class="field">
              <span>랜덤 방식</span>
              <select id="randomMode">
                <option value="soft_weighted" selected>soft_weighted</option>
                <option value="weighted">weighted</option>
                <option value="uniform">uniform</option>
              </select>
              <small class="help-text">
                uniform은 모든 후보를 같은 확률로 뽑고, weighted는 조건에 많이 맞는 작가를 강하게 우대합니다.
                soft_weighted는 그 중간으로, 많이 나온 작가를 조금 우대하되 한쪽으로 너무 쏠리지 않게 합니다.
              </small>
            </label>
            <button id="candidateButton" class="primary">새 후보 검색</button>
          </aside>

          <section class="workspace">
            <div class="toolbar">
              <button id="openConditions" class="secondary hidden">조건 열기</button>
              <button id="nextArtist" class="primary">다음 작가</button>
              <span id="poolStatus" class="pool-status">후보 없음</span>
            </div>
            <div id="status" class="status"></div>

            <section id="result" class="panel result hidden">
              <div class="result-head">
                <div>
                  <h2 id="artistName"></h2>
                  <p id="promptText" class="prompt"></p>
                </div>
                <button id="copyPrompt" class="secondary">프롬프트 복사</button>
              </div>

              <div class="metrics">
                <span id="modeBadge"></span>
                <span id="queryTagsBadge"></span>
                <span id="matchedCount"></span>
                <span id="artistPostCount"></span>
                <span id="candidateCount"></span>
              </div>

              <div class="viewer">
                <button id="prevSample" class="arrow" aria-label="이전 이미지">‹</button>
                <div class="image-stage">
                  <img id="sampleImage" alt="sample image">
                  <div class="image-footer">
                    <span id="sampleCounter"></span>
                    <a id="postLink" href="#" target="_blank" rel="noreferrer">Danbooru post 열기</a>
                  </div>
                </div>
                <button id="nextSample" class="arrow" aria-label="다음 이미지">›</button>
              </div>

              <div class="rating-box">
                <p class="auto-save-note">메모를 먼저 적은 뒤 점수를 누르면 자동 저장하고 다음 작가로 넘어갑니다.</p>
                <div class="score-row" id="scoreButtons">
                  <button data-score="1">1 안 씀</button>
                  <button data-score="2">2 애매</button>
                  <button data-score="3">3 보류</button>
                  <button data-score="4">4 좋음</button>
                  <button data-score="5">5 매우 좋음</button>
                </div>
                <label class="field memo-field">
                  <span>메모</span>
                  <textarea id="memo"></textarea>
                </label>
                <div class="actions">
                  <button id="skipArtist" class="ghost">건너뛰기</button>
                </div>
              </div>
            </section>
          </section>
        </div>
      </section>

      <section id="ratings-tab" class="view">
        <section class="panel manual-add">
          <div class="panel-title">
            <h2>작가 수동 추가</h2>
          </div>
          <label class="field manual-artist-field">
            <span>작가 태그</span>
            <input id="manualArtist" type="text" autocomplete="off" placeholder="artist_tag">
            <div id="manualArtistAutocomplete" class="autocomplete hidden"></div>
          </label>
          <label class="field">
            <span>관련 태그</span>
            <input id="manualTags" type="text" placeholder="dakimakura_(medium), solo">
          </label>
          <label class="field">
            <span>점수</span>
            <select id="manualScore">
              <option value="1">1 안 씀</option>
              <option value="2">2 애매</option>
              <option value="3" selected>3 보류</option>
              <option value="4">4 좋음</option>
              <option value="5">5 매우 좋음</option>
            </select>
          </label>
          <label class="field">
            <span>메모</span>
            <input id="manualMemo" type="text">
          </label>
          <div class="manual-actions">
            <button id="manualPreviewButton" class="secondary">그림 보기</button>
            <button id="manualAddButton" class="primary">추가</button>
          </div>
        </section>
        <section class="panel rating-filters">
          <div class="filter-buttons">
            <button class="filter active" data-filter="all">전체</button>
            <button class="filter" data-filter="score5">5점</button>
            <button class="filter" data-filter="score4">4점 이상</button>
            <button class="filter" data-filter="score3">3점 이하</button>
          </div>
          <label class="field">
            <span>검색어</span>
            <input id="ratingSearch" type="search" placeholder="artist, memo, query">
          </label>
          <label class="field">
            <span>정렬</span>
            <select id="ratingSort">
              <option value="recent">최근 평가순</option>
              <option value="score_desc">점수 높은 순</option>
              <option value="score_asc">점수 낮은 순</option>
              <option value="artist">작가명 순</option>
              <option value="post_count_desc">게시물 수 많은 순</option>
            </select>
          </label>
        </section>
        <div id="ratingsStatus" class="status"></div>
        <section id="ratingsList" class="cards"></section>
      </section>
    </main>

    <div id="manualPreviewModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="manualPreviewTitle">
      <div class="modal-backdrop" data-close-manual-preview></div>
      <section class="modal-dialog">
        <div class="modal-head">
          <div>
            <h2 id="manualPreviewTitle">작가 그림 보기</h2>
            <p id="manualPreviewArtist" class="prompt"></p>
          </div>
          <button id="manualPreviewClose" class="ghost" aria-label="닫기">닫기</button>
        </div>
        <div id="manualPreviewStatus" class="status"></div>
        <div id="manualPreviewViewer" class="viewer hidden">
          <button id="manualPreviewPrev" class="arrow" aria-label="이전 이미지">‹</button>
          <div class="image-stage">
            <img id="manualPreviewImage" alt="manual artist sample">
            <div class="image-footer">
              <span id="manualPreviewCounter"></span>
              <a id="manualPreviewLink" href="#" target="_blank" rel="noreferrer">Danbooru post 열기</a>
            </div>
          </div>
          <button id="manualPreviewNext" class="arrow" aria-label="다음 이미지">›</button>
        </div>
      </section>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
